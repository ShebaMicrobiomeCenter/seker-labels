<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת מדבקות מעבדה - גרסה מלאה</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 25px; }
        .card { border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; background: #fafafa; }
        h3 { margin-top: 0; color: #1a73e8; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input[type="number"], input[type="text"], input[type="range"], input[type="email"] { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; 
        }
        .slider-header { display: flex; justify-content: space-between; align-items: center; }
        .slider-val { background: #1a73e8; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-download { background: #28a745; color: white; }
        .btn-email { background: #007bff; color: white; }
        button:hover { opacity: 0.9; }
        .summary { font-size: 1.2rem; font-weight: bold; margin-top: 25px; text-align: center; color: #d93025; background: #fff1f0; padding: 10px; border-radius: 6px; }
        .memory-hint { font-size: 12px; color: #28a745; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧬 מחולל מדבקות חכם</h1>

    <div class="grid">
        <div class="card">
            <h3>כמויות מדבקות</h3>
            <div id="slider-list"></div>
        </div>

        <div class="card">
            <h3>הגדרות הרצה ומשלוח</h3>
            <div class="input-group">
                <label>אימייל נמען:</label>
                <input type="email" id="email_to" value="lab@example.com">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>מאיזה מספר?</label>
                    <input type="number" id="start_num">
                    <div id="mem-note" class="memory-hint"></div>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>עד איזה מספר?</label>
                    <input type="number" id="end_num">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>חודש (MM):</label>
                    <input type="text" id="month" maxlength="2">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>שנה (YY):</label>
                    <input type="text" id="year" maxlength="2">
                </div>
            </div>

            <div class="btn-stack">
                <button class="btn-download" id="btnDownload">1. הורד קובץ CSV 💾</button>
                <button class="btn-email" id="btnEmail">2. שלח מייל עם קישור להגדרות ✉️</button>
            </div>
        </div>
    </div>

    <div class="summary" id="summaryText">סך מדבקות: 0</div>
</div>

<script>
    // Configuration for all types
    const types = [
        { id: 'Feces', label: 'צואה (Feces)', code: 'F', def: 4 },
        { id: 'Blood', label: 'דם (Blood)', code: 'B', def: 2 },
        { id: 'Mouth', label: 'רוק (Mouth)', code: 'M', def: 2 },
        { id: 'Rectum', label: 'רקטום (Rectum)', code: 'R', def: 0 },
        { id: 'TI', label: 'TI (Terminal Ileum)', code: 'T', def: 0 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        const sliderList = document.getElementById('slider-list');
        const startInput = document.getElementById('start_num');
        const endInput = document.getElementById('end_num');
        const memNote = document.getElementById('mem-note');
        
        // 1. Parse URL Parameters
        const urlParams = new URLSearchParams(window.location.search);

        // 2. Setup Sliders with URL or Defaults
        types.forEach(t => {
            const val = urlParams.get(t.id) || t.def;
            sliderList.innerHTML += `
                <div class="input-group">
                    <div class="slider-header"><label>${t.label}</label><span class="slider-val" id="val-${t.id}">${val}</span></div>
                    <input type="range" class="type-slider" id="${t.id}" min="0" max="10" value="${val}" 
                           oninput="document.getElementById('val-${t.id}').innerText=this.value; update();">
                </div>`;
        });

        // 3. Smart Memory & Date Defaults
        const lastSaved = localStorage.getItem('lab_last_end_num');
        startInput.value = urlParams.get('start') || (lastSaved ? parseInt(lastSaved) + 1 : 161);
        endInput.value = urlParams.get('end') || (parseInt(startInput.value) + 9);
        
        if (!urlParams.has('start') && lastSaved) {
            memNote.innerText = `* ממשיך מ-${lastSaved}`;
        }

        const now = new Date();
        document.getElementById('month').value = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('year').value = String(now.getFullYear()).slice(-2);

        // 4. Update Logic
        window.update = () => {
            const start = parseInt(startInput.value);
            const end = parseInt(endInput.value);
            const range = (end - start + 1);
            let totalPerPerson = 0;
            types.forEach(t => totalPerPerson += parseInt(document.getElementById(t.id).value));
            
            const total = isNaN(range) || range < 0 ? 0 : range * totalPerPerson;
            document.getElementById('summaryText').innerText = `סך מדבקות לייצור: ${total}`;
        };

        // 5. Generate Shareable Link
        function getShareLink() {
            const baseUrl = window.location.href.split('?')[0];
            const p = new URLSearchParams();
            p.set('start', startInput.value);
            p.set('end', endInput.value);
            types.forEach(t => p.set(t.id, document.getElementById(t.id).value));
            return `${baseUrl}?${p.toString()}`;
        }

        // 6. Event Listeners
        document.getElementById('btnDownload').addEventListener('click', () => {
            const start = parseInt(startInput.value);
            const end = parseInt(endInput.value);
            const m = document.getElementById('month').value.padStart(2, '0');
            const y = document.getElementById('year').value;

            if (isNaN(start) || isNaN(end) || start > end) return alert("טווח לא תקין");

            let csv = "\ufeffpnid,long_type,type,barcode\n";
            for (let i = start; i <= end; i++) {
                const pnid = `SK${String(i).padStart(4, '0')}`;
                types.forEach(t => {
                    const count = document.getElementById(t.id).value;
                    for (let c = 0; c < count; c++) {
                        csv += `${pnid},${t.label},${t.code},${pnid}${t.code}${m}${y}\n`;
                    }
                });
            }

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Labels_${start}_to_${end}.csv`;
            link.click();

            // Save Memory
            localStorage.setItem('lab_last_end_num', end);
        });

        document.getElementById('btnEmail').addEventListener('click', () => {
            const link = getShareLink();
            const to = document.getElementById('email_to').value;
            const subject = encodeURIComponent(`הגדרות מדבקות: ${startInput.value}-${endInput.value}`);
            const body = encodeURIComponent(
                `שלום,\n\nמצורף קישור להגדרות המדבקות עבור טווח המספרים ${startInput.value} עד ${endInput.value}.\n\n` +
                `לחץ כאן כדי לטעון את ההגדרות ולהפיק את הקובץ:\n${link}\n\n` +
                `נא לצרף את קובץ ה-CSV להודעה זו לאחר ההורדה.`
            );
            window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
        });

        [startInput, endInput].forEach(el => el.addEventListener('input', update));
        update();
    });
</script>
</body>
</html>
